# Run from the profiling worktree: uv run python -m scripts.run_profiling --config config/profiling.yaml
# All relative paths are relative to the worktree root. This file is read-only to the runner.
output_root: runs/profiling
smoke: false
experiments: [full, scaling, reference]
primary_backend: gpu
gpu_index: 0
cpu_affinity: null  # null inherits the caller's allowed CPUs; otherwise give logical CPU indices.
cpu_threads: 8  # BLAS/OpenMP setting; use cpu_affinity to restrict all JAX CPU workers.
seed: 0
model_overrides: {enable_x64: true, num_edge_steps: 25}
benchmark:
  repeats: 3
  target_warmup: 10
  target_iterations: 200
  mcmc_warmup: 20
  mcmc_iterations: 200
  min_measure_seconds: 10
  timeout_seconds: 1800
  memory_interval_seconds: 0.05
full: {num_chains: 4, num_samples: 5000, num_processes: 4, timeout_seconds: 21600}
# Post-processing only; does not discard stored samples or change timing windows.
full_diagnostics: {burnin_fraction: 0.1}
reference_dataset: butterflies
reference_landmarks: [32, 64, 118]
datasets:
  butterflies:
    analysis_config: config/butterflies.yaml
    tips: [32, 64, 128, 256, 425]
    landmarks: [16, 32, 64, 96, 118]
    params: {k_alpha: 0.134, k_sigma: 0.212, obs_var: 0.00125}
  beaks:
    analysis_config: config/beaks.yaml
    tips: [32, 64, 128, 256, 348]
    landmarks: [16, 32, 48, 64, 79]
    params: {k_alpha: 0.113, k_sigma: 0.152, obs_var: 0.000408}
